<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SiteCheck Legal">
  <!-- Марка бренда: оттиск печати. Формы, а не эффекты — знак должен читаться
       на 16px в табе, где любая деталь тоньше двух пикселей исчезает. -->
  <rect width="64" height="64" rx="10" fill="#8f2f26"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="6.5"
        fill="none" stroke="#fdfbfa" stroke-opacity=".5" stroke-width="2"/>
  <text x="32" y="43" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="30" letter-spacing="-1" fill="#fdfbfa">SC</text>
</svg>
