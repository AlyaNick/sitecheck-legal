<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Юридическая проверка сайта по 152-ФЗ и 168-ФЗ. Проверим формы, согласия, документы, cookies и публичную информацию."
    />
    <title>SiteCheck Legal — Юридическая проверка сайта</title>

    <!-- Иконка сайта. SVG для современных вкладок, PNG 48px — то, что читает
         поисковая выдача (Google требует квадрат, кратный 48, по стабильному
         адресу и не закрытый от обхода). 512px — для установки на устройство. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#8f2f26" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
